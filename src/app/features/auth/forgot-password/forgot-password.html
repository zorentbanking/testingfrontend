
<div class="auth-container">
  <div class="auth-card">
    <h2>Forgot Password</h2>
    <p class="subtitle">Enter your email to reset your account</p>
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email"
               id="email"
               formControlName="email"
               placeholder="name@gmail.com"
               [class.error-border]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
        <div *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched" class="error-text">
          Please enter a valid email address.
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="forgotPasswordForm.invalid">
        Reset Password  &rarr;
      </button>

      <div class="footer-links">
        <a routerLink="/login" class="back-link">Back to Sign In</a>
      </div>
    </form>
  </div>
</div>
