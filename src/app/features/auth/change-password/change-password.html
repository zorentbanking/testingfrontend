<div class="container">
  <div class="card">
    <h2>Change Password</h2>
    <p class="subtitle">Enter your new password below to update your account.</p>

    <form (ngSubmit)="onChangePassword()" #passwordForm="ngForm">
      <div class="input-group">
        <label>New Password</label>
        <input type="password"
               name="newPassword"
               [(ngModel)]="newPassword"
               placeholder="********"
               required>
      </div>

      <div class="input-group">
        <label>Confirm New Password</label>
        <input type="password"
               name="confirmPassword"
               [(ngModel)]="confirmPassword"
               placeholder="********"
               required>
      </div>

      <button type="submit" class="change-btn" [disabled]="!passwordForm.form.valid">
        Change Password &rarr;
      </button>

      <div class="footer-link">
        <a routerLink="/login">Back to Sign In</a>
      </div>
    </form>
  </div>
</div>
