<div *ngIf="showNavbar">    
<div class="container-fluid px-4">

  <div class="navbar-wrapper px-4">


<div class="d-flex justify-content-between align-items-center zorent-sticky-header mb-5 pb-3 header-border  ">

  <nav class="d-flex gap-4 align-items-center ">

    <a routerLink="/dashboard"
       class="d-flex align-items-center text-decoration-none">

      <div class="zorent-logo-container me-3 shadow-sm">

        <img src="https://logowik.com/content/uploads/images/t_zeronet1628.jpg"
             alt="Zorent Logo"
             class="zorent-main-logo">

      </div>

      <div class="fw-bold logo-glow fs-4 me-3">

        ZORENT

      </div>

    </a>

    <a routerLink="/dashboard"
       routerLinkActive="active"
       class="nav-link-custom">

      Dashboard

    </a>

    <a routerLink="/transactions"
       routerLinkActive="active"
       class="nav-link-custom">

      Transactions

    </a>

    <a routerLink="/transfer"
       routerLinkActive="active"
       class="nav-link-custom">

      Transfer

    </a>

  </nav>

  <div class="profile-area d-flex align-items-center gap-3">

    <div class="profile-trigger"
         (click)="toggleProfile()">

      <div class="avatar-circle shadow-sm">

        {{ userName.charAt(0).toUpperCase() }}

      </div>

      <i class="bi bi-chevron-down ms-2 small text-muted"></i>

    </div>

    <ul class="custom-dropdown shadow-lg"
        [class.show]="isProfileOpen">

      <li class="user-details-header">

        <div class="text-center mb-3">

          <h6 class="fw-bold mb-0">

            {{ userName }}

          </h6>

          <small class="text-muted">

            username : {{ userUsername }}

          </small>

        </div>

      </li>

      <li>

        <a class="profile-item"
           routerLink="/profile-settings">

          <i class="bi bi-person-circle me-2"></i>

          Profile Settings

        </a>

      </li>

      <li>

        <a class="profile-item"
           routerLink="/closed-accounts">

          <i class="bi bi-archive me-2"></i>

          Closed Accounts

        </a>

      </li>

      <li>

        <a class="logout-item"
           (click)="logout()">

          <i class="bi bi-box-arrow-right me-2"></i>

          Logout

        </a>

      </li>

    </ul>

    <button class="logout-icon-btn"
            (click)="logout()">

      <i class="bi bi-box-arrow-right"></i>

    </button>

  </div>

</div>
</div>
</div>
</div>
